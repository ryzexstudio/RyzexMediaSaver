<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ryzex Media Saver</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <svg class="svg-defs" aria-hidden="true"><defs><symbol id="download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M5 17v4h14v-4"/></symbol><symbol id="trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5m4-5v5"/></symbol></defs></svg>
  <main class="shell">
    <header class="topbar"><div class="identity"><img src="icons/icon48.png" alt=""><div><a class="brand-link" href="https://ryzexstudio.com" target="_blank" rel="noopener noreferrer"><b>Ryzex<span>Studio</span></b></a><small>Media Saver</small></div></div><div class="header-tools"><div class="platforms" aria-label="Supported platforms" data-i18n-label="platforms"><span>TikTok</span><span>Instagram</span><span>X</span></div>
      <div class="language-control" id="languageControl">
        <button id="uiLanguage" class="language-picker" type="button" aria-label="Language: English" aria-haspopup="listbox" aria-expanded="false" aria-controls="languageMenu"><img id="languageFlag" src="assets/flags/us.svg" alt="" width="20" height="14"><span id="languageName">English</span><svg class="language-chevron" aria-hidden="true" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg></button>
        <div id="languageMenu" class="language-menu" role="listbox" aria-label="Language" data-i18n-label="language" hidden>
          <button type="button" role="option" data-language="en" aria-selected="true" tabindex="-1" lang="en"><img src="assets/flags/us.svg" alt="" width="24" height="17"><span>English</span><small>EN</small><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></button>
          <button type="button" role="option" data-language="tr" aria-selected="false" tabindex="-1" lang="tr"><img src="assets/flags/tr.svg" alt="" width="24" height="17"><span>Türkçe</span><small>TR</small><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></button>
          <button type="button" role="option" data-language="es" aria-selected="false" tabindex="-1" lang="es"><img src="assets/flags/es.svg" alt="" width="24" height="17"><span>Español</span><small>ES</small><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></button>
          <button type="button" role="option" data-language="az" aria-selected="false" tabindex="-1" lang="az"><img src="assets/flags/az.svg" alt="" width="24" height="17"><span>Azərbaycanca</span><small>AZ</small><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></button>
          <button type="button" role="option" data-language="fr" aria-selected="false" tabindex="-1" lang="fr"><img src="assets/flags/fr.svg" alt="" width="24" height="17"><span>Français</span><small>FR</small><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></button>
          <button type="button" role="option" data-language="ru" aria-selected="false" tabindex="-1" lang="ru"><img src="assets/flags/ru.svg" alt="" width="24" height="17"><span>Русский</span><small>RU</small><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></button>
        </div>
      </div>
    </div></header>
    <section class="composer" aria-labelledby="composeTitle">
      <div class="section-heading"><label id="composeTitle" for="urlList" data-i18n="links">Links</label><span data-i18n="limit">Up to 50</span></div>
      <textarea id="urlList" rows="3" spellcheck="false" data-i18n-placeholder="placeholder" placeholder="Paste a post link&#10;You can add one link per line."></textarea>
      <div class="compose-actions"><button class="primary" id="addLinks" type="button"><svg aria-hidden="true"><use href="#download"/></svg><span data-i18n="add">Add to downloads</span></button></div>
    </section>
    <div class="quota-actions"><button id="settingsToggle" type="button" aria-controls="settingsSection" aria-expanded="false"><span data-i18n="daily">Daily allowance</span><svg class="disclosure-arrow" aria-hidden="true" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg></button></div>
    <section class="settings" id="settingsSection" hidden aria-label="Daily allowance" data-i18n-label="daily"><div class="section-heading"><b data-i18n="remaining">Remaining downloads</b><span data-i18n="perPlatform">50 per platform</span></div><div class="stats quota-stats"><div><span>TikTok</span><strong id="quotaTikTok">…</strong></div><div><span>Instagram</span><strong id="quotaInstagram">…</strong></div><div><span>X</span><strong id="quotaX">…</strong></div></div><p class="allowance-note" data-i18n="freeDaily">Free daily allowance · renews at 00:00 UTC</p><button class="secondary" id="refreshQuota" type="button" data-i18n="refresh">Refresh</button></section>
    <section class="queue-panel" aria-labelledby="queueTitle">
      <div class="section-heading queue-heading"><h1 id="queueTitle" data-i18n="downloads">Downloads</h1><button class="text-button" id="clearDone" type="button"><svg aria-hidden="true"><use href="#trash"/></svg><span data-i18n="clear">Clear finished</span></button></div>
      <div class="stats queue-stats" role="tablist" aria-label="Download status" data-i18n-label="states"><button id="queueTabQueued" class="queue-tab" type="button" role="tab" data-state="queued" aria-controls="queueList" aria-selected="true"><span data-i18n="pending">Queued</span><strong id="queuedCount">0</strong></button><button id="queueTabStarted" class="queue-tab" type="button" role="tab" data-state="started" aria-controls="queueList" aria-selected="false" tabindex="-1"><span data-i18n="completed">Completed</span><strong id="startedCount">0</strong></button><button id="queueTabError" class="queue-tab" type="button" role="tab" data-state="error" aria-controls="queueList" aria-selected="false" tabindex="-1"><span data-i18n="failed">Failed</span><strong id="failedCount">0</strong></button></div>
      <div id="queueList" class="queue-list" role="tabpanel" aria-labelledby="queueTabQueued" tabindex="0"><div class="empty" data-i18n="emptyQueued">No downloads in the queue.</div></div>
    </section>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <footer class="footer"><a class="footer-brand" href="https://ryzexstudio.com" target="_blank" rel="noopener noreferrer">Ryzex<span>Studio</span></a><span class="footer-divider" aria-hidden="true"></span><a href="https://github.com/imputnet/cobalt" target="_blank" rel="noopener noreferrer"><span>cobalt</span><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 17 17 7M7 7h10v10"/></svg></a><a id="privacyLink" href="privacy.html" target="_blank" rel="noopener noreferrer" data-i18n="privacy">Privacy</a><button id="feedbackOpen" class="feedback-open" type="button" aria-haspopup="dialog"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg><span data-i18n="feedback">Feedback</span></button></footer>
  </main>
  <dialog id="feedbackDialog" class="feedback-dialog" aria-labelledby="feedbackTitle" aria-describedby="feedbackIntro">
    <form id="feedbackForm" novalidate>
      <div class="feedback-heading"><h2 id="feedbackTitle" data-i18n="feedback">Feedback</h2><button id="feedbackClose" class="feedback-close" type="button" aria-label="Close" data-i18n-label="close"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
      <p id="feedbackIntro" data-i18n="feedbackIntro">Tell us about a problem or share a suggestion.</p>
      <label for="feedbackSubject" data-i18n="feedbackSubject">Subject</label>
      <input id="feedbackSubject" name="subject" type="text" required maxlength="120" autocomplete="off" placeholder="What would you like to share?" data-i18n-placeholder="feedbackSubjectPlaceholder">
      <label for="feedbackDescription" data-i18n="feedbackDescription">Description</label>
      <textarea id="feedbackDescription" name="description" rows="5" required maxlength="1500" placeholder="Describe your issue or suggestion…" data-i18n-placeholder="feedbackDescriptionPlaceholder"></textarea>
      <div id="feedbackStatus" class="feedback-status" role="status" aria-live="polite"></div>
      <div class="feedback-actions"><button id="feedbackCancel" class="feedback-cancel" type="button" data-i18n="close">Close</button><button id="feedbackSubmit" class="primary" type="submit"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 3-6 18-4-8-8-4 18-6ZM11 13l10-10"/></svg><span id="feedbackSubmitLabel" data-i18n="feedbackOpenEmail">Send feedback</span></button></div>
    </form>
  </dialog>
  <script src="locales/en.js"></script><script src="locales/tr.js"></script><script src="locales/es.js"></script><script src="locales/az.js"></script><script src="locales/fr.js"></script><script src="locales/ru.js"></script><script src="locales/legacy-tr.js"></script><script src="i18n.js"></script><script src="shared.js"></script><script src="popup.js"></script>
</body>
</html>
